<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon-connectcab.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Primary SEO Meta Tags -->
  <title>ConnectCab – Find Local Cabs in South Gujarat | Compare Fuel Type & Price</title>
  <meta name="description" content="ConnectCab connects you with verified local cab owners across Bilimora, Navsari & Surat. Enter your destination, compare petrol/diesel/CNG cars and prices, and book instantly." />
  <meta name="keywords" content="cab booking Bilimora, taxi Navsari, cab marketplace Gujarat, outstation cab South Gujarat, ConnectCab, local taxi network Gujarat, compare cab price, cab owner registration Gujarat" />
  <meta name="author" content="ConnectCab" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://connectcab.niklosafar.com/" />

  <!-- ✅ Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://connectcab.niklosafar.com/" />
  <meta property="og:title" content="ConnectCab – South Gujarat's Local Cab Network" />
  <meta property="og:description" content="Tell us where you're going — we'll show you who's driving there. Compare verified local cabs by fuel type & price across Bilimora, Navsari & Surat." />
  <meta property="og:image" content="https://connectcab.niklosafar.com/og-image.jpg" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:site_name" content="ConnectCab" />

  <!-- ✅ Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ConnectCab – South Gujarat's Local Cab Network" />
  <meta name="twitter:description" content="Compare verified local cabs by fuel type & price. Book instantly across Bilimora, Navsari & Surat." />
  <meta name="twitter:image" content="https://connectcab.niklosafar.com/og-image.jpg" />

  <!-- ✅ JSON-LD: WebSite + Service marketplace -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ConnectCab",
    "url": "https://connectcab.niklosafar.com",
    "description": "ConnectCab is a local cab marketplace connecting riders with verified independent cab owners across Bilimora, Navsari and South Gujarat. Search a destination to compare available cars by fuel type and price.",
    "areaServed": [
      { "@type": "City", "name": "Bilimora" },
      { "@type": "City", "name": "Navsari" },
      { "@type": "City", "name": "Surat" }
    ],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://connectcab.niklosafar.com/?destination={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Fonts used throughout the app -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Razorpay Checkout -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script type="module" src="/src/main.jsx"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
